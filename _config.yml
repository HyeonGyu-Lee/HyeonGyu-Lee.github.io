title: AUTOSAR dev
description: 소개
baseurl: "/"
url: "https://AUTOSAR.dev"
repository: RapidAUTOSAR/blog

permalink: pretty

exclude:
  # from https://github.com/jekyll/jekyll/blob/master/lib/site_template/_config.yml:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # specific to the theme website:
  - bin/
  - lib/
  - "*.gemspec"
  - "*.gem"
  - LICENSE.txt
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - CODE_OF_CONDUCT.md
  - docker-compose.yml
  - Dockerfile
  # theme test code
  - fixtures/

# Set a path/url to a logo that will be displayed instead of the title
# logo: "/assets/images/rapid-auto.png"

favicon_ico: "/assets/images/favicon.ico"

# Enable or disable the site search
# Supports true (default) or false
search_enabled: true
search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 2
  # Maximum amount of previews per search result
  # Default: 3
  previews: 2
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 3
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 3
  # Set the search token separator
  # Default: /[\s\-/]+/
  # Example: enable support for hyphenated search words
  tokenizer_separator: /[\s/]+/
  # Display the relative url in search results
  # Supports true (default) or false
  rel_url: true
  # Enable or disable the search button that appears in the bottom right corner of every page
  # Supports true or false (default)
  button: false

# For copy button on code
enable_copy_code_button: false

# By default, consuming the theme as a gem leaves mermaid disabled; it is opt-in
mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
  version: "9.1.6"
  # Put any additional configuration, such as setting the theme, in _includes/mermaid_config.js
  # See also docs/ui-components/code
  # To load mermaid from a local library, also use the `path` key to specify the location of the library; e.g.
  # for (v10+):
  # path: "/assets/js/mermaid.esm.min.mjs"
  # for (<v10):
  path: "/assets/js/mermaid.min.js"
  # Note: copy both `mermaid.esm.min.mjs` (v10+) or `mermaid.min.js` (<v10) and the associated `.map` file from the specified version of `mermaid/dist` to `/assets/js/`.

# Enable or disable heading anchors
heading_anchors: true

# aux_links_active: false
# Aux links for the upper right navigation
aux_links: true
#  "Contact Us":
#     - "https://www.mdsit.co.kr/Inquiry"
#    - "mailto:autosar@mdsit.co.kr"
# https://rapidauto.notion.site/RapidAUTO-Help-Contents-a907e4391cc9458481ce9140b6d2ef3c
# Makes Aux links open in a new tab. Default is false
# aux_links_new_tab: true

# Sort order for navigation links
# nav_sort: case_insensitive # default, equivalent to nil
nav_sort: nil
# case_sensitive
# Capital letters sorted before lowercase

# External navigation links
# nav_external_links:
#  - title: RapidAUTO Help Contents
#    url: https://rapidauto.notion.site/RapidAUTO-Help-Contents-a907e4391cc9458481ce9140b6d2ef3c
#    hide_icon: false
#    opens_in_new_tab: true

# Footer content
# appears at the bottom of every page's main content

# Back to top link
back_to_top: true
back_to_top_text: "Top"

footer_content: ""

# Footer last edited timestamp
last_edit_timestamp: false # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%Y-%m-%d %H:%M" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html



# Footer "Edit this page on GitHub" link text
gh_edit_link: false # show or hide edit this page link
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/just-the-docs/just-the-docs" # the github URL for your repo
gh_edit_branch: "main" # the branch that your docs is served from
# gh_edit_source: docs # the source that your files originate from
gh_edit_view_mode: "tree" # "tree" or "edit" if you want the user to jump into the editor immediately

# Color scheme currently only supports "dark", "light"/nil (default), or a custom scheme that you define
color_scheme: light

callouts_level: quiet # or loud
callouts:
  white:
    color: grey
    opacity: 0.1
  highlight:
    color: yellow
  notice:
    title: Notice
    color: skyblue
    opacity: 0.1
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
  caution:
    title: Caution
    color: yellow
    opacity: 0.4
  red:
    color: red
    opacity: 0.3
  orange:
    color: orange
    opacity: 0.3
  yellow:
    color: yellow
    opacity: 0.3
  green:
    color: green
    opacity: 0.3
  blue:
    color: blue
    opacity: 0.3
  purple:
    color: purple
    opacity: 0.3
  pink:
    color: pink
    opacity: 0.3
  brown:
    color: brown
    opacity: 0.3
  grey:
    color: grey
    opacity: 0.3

  # Google Analytics Tracking (optional)
  # Supports a CSV of tracking ID strings (eg. "UA-1234567-89,G-1AB234CDE5")
  # Note: the main Just the Docs site does *not* use Google Analytics.
ga_tracking: G-TSCTJW9RLN, GTM-P99H826J
ga_tracking_anonymize_ip: true # Use GDPR compliant Google Analytics settings (true/nil by default)

gems:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-redirect-from

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  
whitelist:
  - jekyll-redirect-from

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [ ]
  blanklines: false
  profile: false
  # ignore:
  #   envs: all

include:
  - "_images"
  - "_files"